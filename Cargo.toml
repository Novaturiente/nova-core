[package]
name = "nova-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Engine-independent core shared by novabrowser (CEF) and novabrowser-webkit"
publish = false

[dependencies]
oxc_allocator = "0.153"
oxc_codegen = "0.153"
oxc_parser = "0.153"
oxc_semantic = "0.153"
oxc_span = "0.153"
oxc_transformer = "0.153"
rquickjs = { version = "0.14.0", features = ["loader"] }
rusqlite = "0.40.2"
serde_json = "1.0.152"
